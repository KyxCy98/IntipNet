name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            compiler: g++
            strip: strip
            pkg: ""
          - arch: aarch64
            compiler: aarch64-linux-gnu-g++
            strip: aarch64-linux-gnu-strip
            pkg: "g++-aarch64-linux-gnu binutils-aarch64-linux-gnu"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install compilers and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y zip ${{ matrix.pkg }}

    - name: Build binary (Static)
      run: |
        mkdir -p build
        # Menggunakan wildcard agar semua file .cpp di dalam module ikut ter-compile
        ${{ matrix.compiler }} lib/main/main.cpp lib/main/module/*.cpp \
        -o build/intipnet \
        -Wall -Wextra -std=c++17 -Iinclude \
        -static \
        -fno-stack-protector -Wl,--hash-style=both

    - name: Strip binary
      run: ${{ matrix.strip }} build/intipnet

    - name: Create ZIP archive
      run: |
        cd build
        zip intipnet-linux-${{ matrix.arch }}.zip intipnet
        cd ..

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/intipnet-linux-${{ matrix.arch }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
